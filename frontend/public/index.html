<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <title>WasteWise - AI Powered Waste Management</title>

    <!-- ===== Language Button Styling (NEW – SAFE) ===== -->
    <style>
      #language-pill {
        position: fixed;
        top: 35px; 
        right: 22px;
        z-index: 9999;
        display: flex;
        align-items: center;
        padding: 6px 16px;
        border-radius: 999px;
        background: #ffffff;
        border: 1.5px solid #2f8f5b;
        color: #2f8f5b;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }

      #language-pill:hover {
        background: #e9f7ef;
      }

      #google_translate_element select {
        border: none;
        background: transparent;
        color: #2f8f5b;
        font-size: 14px;
        cursor: pointer;
        outline: none;
      }

      .goog-logo-link,
      .goog-te-gadget span {
        display: none !important;
      }

      .goog-te-gadget {
        font-size: 0;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- ================= GOOGLE TRANSLATE START (NEW) ================= -->

    <!-- Language Button -->
    <div id="language-pill">
      <span style="margin-right:6px;">Change Language</span>
      <div id="google_translate_element"></div>
    </div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,ta,te,kn,ml,bn,pa,gu,ur,fr,es,de,it,pt,ru,ja,ko,zh,ar',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          'google_translate_element'
        );
      }
    </script>

    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>

    <!-- ================= GOOGLE TRANSLATE END ================= -->
  </body>
</html>
